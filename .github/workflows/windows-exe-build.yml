name: Build Antigravity Studio Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    paths:
      - 'app/**'
      - 'static/**'
      - 'run.py'
      - 'requirements.txt'
      - '.github/workflows/windows-exe-build.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Windows Executable (.exe)
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name "AntigravityStudio" `
            --add-data "static;static" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            --hidden-import "app" `
            --hidden-import "app.main" `
            --hidden-import "app.database" `
            --hidden-import "app.interactions_client" `
            --hidden-import "app.local_agent" `
            --hidden-import "app.cli" `
            run.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-studio-windows-exe
          path: dist/AntigravityStudio.exe

      - name: Publish Windows EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AntigravityStudio.exe
          generate_release_notes: true
